# ── CodeMirror: real layout engine needed for `.CodeMirror-code` content rendering ──
#
# CodeMirror initializes via `CodeMirror.fromTextArea(ta)` which builds
# a `.CodeMirror` widget wrapper (we verified this lands in v3). The
# widget's `.CodeMirror-code` line container is rendered via
# CodeMirror's measurement-driven render loop — `cm.display.measure*`
# reads `getBoundingClientRect()` and computes line heights/cursor
# positions. Without a layout engine, the lines never render text:
# even when the underlying doc has content (e.g. `user.custom_css =
# ".x{}"`), `.CodeMirror-code` stays empty. True layout dependency.

# CodeMirror tests that exercise the contenteditable read-back
# (`:47` "filled code editor", `:71` "displays the projects custom_css")
# now pass via the per-char input pipeline (commit f6e4553). Two more
# (`CodeField without value` and `ResourceSidebars allow fields …`)
# started passing once the click hit-test approximation retargets a
# click on the `.CodeMirror` wrapper to the inner focusable textarea
# — capybara's `find('.CodeMirror').click` then focuses the hidden
# `<textarea>` and subsequent `type` keystrokes land where CodeMirror
# expects them.

# All Tagify cluster tests now pass — keyboard-default-action
# deferral via setTimeout(0) lets Tagify's `beforeKeyDown(e).then(()
# => e.preventDefault())` promise resolve before the key's default
# (newline insertion) runs, matching the UI Events spec's microtask
# checkpoint between dispatch and default action.

# ── Algolia autocomplete: `input.aa-Input` never constructed ──
#
# Avo's search uses `@algolia/autocomplete-js`. The widget mounts
# itself onto a host element by creating a `<input class="aa-Input">`
# sibling. In v3 the mount never produces the input — tests querying
# `//input[@class='aa-Input']` find nothing. Algolia's autocomplete
# uses `getBoundingClientRect` for panel positioning and has its own
# render loop that gates on measurable geometry; without layout it
# bails before constructing the input shell.

