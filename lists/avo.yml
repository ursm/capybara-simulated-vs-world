# Tests we don't expect capybara-simulated to satisfy. Each entry is
# `{test:, reason:[, engine:]}`. `test:` is preferred as the RSpec
# `full_description` (stable across upstream line-number moves) but
# may also be a `./spec/...rb:LINE` location string or a Regexp
# matched against either. `engine:` is optional; when set, the entry
# is honoured only when `CSIM_JS_ENGINE` matches (`v8` or `quickjs`),
# so engine-divergent tests don't flip-to-FIXED on the other side.
#
# Cleared 2026-05-15 — the previous list was from v2 era and many
# entries had since started passing on v3. Re-populate with entries
# that have concrete current evidence (out-of-scope feature, real
# layout dependency, async-runtime requirement) backed by a probe,
# not historical guess.

# ── KV: depends on a Cuprite quirk ────────────────────────────────
- test: "KeyValueFields without value won't change the value"
  reason: |
    Test relies on Cuprite-specific behavior, not real-browser
    semantics. `disabled_field.trigger("input")` is a silent no-op
    in Cuprite 0.17 (the JS shim throws "Unknown event" for non-
    mouse/focus/form events; Ferrum's `handle_error` only raises
    for subtype=="error" so the string-throw passes through as
    nil). Real Chrome fires the listener and the controller
    updates the value to "bazz", so v3's spec-compliant dispatch
    also runs the handler and the saved value is "bazz" rather
    than the expected "".

# ── Flatpickr: tests depend on Cuprite's synthetic-blur on every set + sleep-based real-time elapsing ──
#
# Each Avo time-picker test follows the pattern:
#   set_picker_hour 17     # set value, FOCUS-or-blur depending on driver
#   set_picker_minute 17
#   set_picker_second 17
#   close_picker           # `trigger("click")` on title (no focus shift)
#   save
#
# flatpickr's time-input commit path is `bind(timeContainer, "blur",
# updateTime, {capture:true})` → updateTime() → `_debouncedChange =
# debounce(triggerChange, 300)`. Avo's `date_field_controller.js`
# relays flatpickr's `onChange` to the REAL `<input name=...>` via
# `updateRealInput`; the form submits that real input.
#
# In Cuprite, every `Node#set` explicitly fires a synthetic `blur`
# at the end. That registers the 300ms debounce timer right then,
# and real wall time (CDP latency between Capybara calls + the
# `sleep 0.3` inside `close_picker`) elapses past 300 ms before
# the save click. The debounce fires, `updateRealInput` writes the
# correct value, the form submits with seconds intact.
#
# In v3 (virtual time), `set` doesn't fire synthetic blur, so the
# debounce timer isn't registered until the LAST focus shift (the
# save click). The fetch then serializes the form synchronously
# inside the click chain, BEFORE the 300 ms timer can fire.
#
# Adding unconditional blur to v3's `set` regresses jQuery-UI
# autocomplete (Redmine `test_edit_should_allow_adding_multiple_
# relations_from_autocomplete` — menu closes on blur before the
# `within('ul.ui-autocomplete')` lookup). This is fundamentally a
# Cuprite-specific test pattern.

