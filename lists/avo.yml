# ── Tippy: tooltip positioning requires getBoundingClientRect ──
- test: "Record previews opens the preview"
  reason: |
    Tippy mounts the popover via `appendChild(<div id="tippy-N">)`
    using `getBoundingClientRect` to compute placement. v3's
    zero-geometry stub causes Tippy to bail before appending —
    `#tippy-1` never appears in the DOM.

# ── Lazy turbo-frames load eagerly without viewport intersection ──
#
# Our IntersectionObserver fires for any element that's in the DOM
# and not `display:none`. Real-browser IO uses pixel-level viewport
# intersection — a `<turbo-frame loading=lazy>` below the fold stays
# in its "Loading…" placeholder until the user scrolls. Tests that
# assume the frames stay unloaded (no "No related record found",
# no embedded `[data-controller='tabs']`, etc.) fail when our IO
# loads every frame eagerly. Closing this gap needs a real viewport-
# bounds model (track scroll position + element offsets); out of
# scope until layout becomes more than a stub.
- test: "HasAndBelongsToManyField show with an attached user detaches the user"
  reason: "Eager lazy-frame load surfaces 'No related record found' from below-fold frames before the test's pre-detach assertion."
- test: "HasOneField omits parent record hides the belongs_to field pointing back to the parent on the embedded show page"
  reason: "Eager lazy-frame load mounts the embedded show's own `[data-controller='tabs']`, so `click_tab` ambiguous-matches two tabSwitchers."
- test: "Filters pagination resets when filters change with pagination set resets the pagination"
  reason: |
    Our drain reaches `consume_pending_navigation` and the filter
    applies (correct behavior). Test expects
    `[data-turbo-frame][aria-label='Previous']` but Pagy 9 renders
    the disabled Previous on page 1 without `data-turbo-frame` —
    the assertion's brittle to pagination resetting to page 1.

