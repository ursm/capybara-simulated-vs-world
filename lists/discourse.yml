# merged 2026-05-25) and would fail in real-Chrome / Playwright
# the same way; needs an upstream fix to either widen the filter
# to include `entry[:type]` or to change the search term.
- test: 'Admin Dashboard Redesign | Reports section lets admins customize the reports section via the manage-reports modal'
  reason: 'Upstream test bug: `CoreReportProvider#filter_by_search` checks title/description only; search "admin_logins" can never match title "Admin Logins" (underscore vs space). PR #40264 (2026-05-25); not a driver gap.'

# ── Driver gaps that need deeper work ──────────────────────────
# Documented here so they don't re-surface as "FIXED" surprises;
# fixing each is a separate piece of work that hasn't been
# completed yet.

# `route_to_topic_post` triggers `topic.fromParams.afterModel` →
# `appEvents.trigger("nested:scroll-to-target")` →
# `forceScheduleScroll` → `next()` (`setTimeout 0`). The next
# transition's `setupController` + new `_renderKey` schedules a
# Glimmer re-render via `setTimeout 1`. Real browsers separate
# the two macrotasks by ≥ 1 ms of wall clock so Capybara catches
# the highlight class on the OLD postEl in between. Our
# `__drainTimers(50)` fires both within one tick. Tried adding a
# settle_gen-aware inter-macrotask yield to drainTimers — didn't
# help, the OLD postEl is detached before any Capybara poll lands.
# Needs a paint-boundary equivalent yield strategy.
- test: 'Nested context view in-route navigation between context views keeps the URL on /n/ and re-highlights when /t/ is routed to the post we''re already on'
  reason: 'Highlight class added to OLD postEl, Glimmer re-render detaches it within the same `__drainTimers` tick before Capybara polls. Needs a paint-boundary yield.'

# `/theme-qunit?id=...` boots Discourse''s QUnit harness; in our
