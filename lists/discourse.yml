# `toggleSearchMenu`. The other three (`enable_welcome_banner=false` and
# the in-viewport `enable_welcome_banner=true` cases) pass now that
# `focus()` respects display:none and `keyup` retargets to the active
# element after a keydown handler blurs.
- test: 'Search | Shortcuts for variations of search input when search_experience is search_field when enable_welcome_banner is true when welcome banner is not in the viewport displays and focuses header search when / is pressed and hides it when Escape is pressed'
  reason: 'Needs real scroll + IntersectionObserver-against-viewport for welcomeBannerSearchInViewport to flip.'
