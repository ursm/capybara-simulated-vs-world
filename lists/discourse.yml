# mozjpeg WASM operates on libvips-decoded RGBA. Our libvips
# PNG decode produces slightly different RGBA bytes from
# Chrome's `createImageBitmap` (the encoding pipeline is
# byte-exact otherwise — JPEG-resize specs all match). Expected
# 285_809; ours 271_246 (~5% delta). Fix needs libvips decoder
# flags tuned to match Chrome's PNG decode (gamma / alpha
# pre-multiplication / chroma) or a different decode backend.
- test: 'Composer image optimization for uploads using media-optimization-worker png images optimizes an uploaded png image in the composer'
  reason: 'libvips PNG decode RGBA differs from Chrome createImageBitmap; mozjpeg pipeline propagates ~5% byte delta (271_246 vs 285_809).'

