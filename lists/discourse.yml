# Tests we don't expect capybara-simulated to satisfy. Each entry is
# `{test:, reason:[, engine:]}`. `test:` is preferred as the RSpec
# `full_description` (stable across upstream line-number moves) but
# may also be a `./spec/...rb:LINE` location string or a Regexp
# matched against either. `engine:` is optional; when set, the entry
# is honoured only when `CSIM_JS_ENGINE` matches (`v8` or `quickjs`),
# so engine-divergent tests don't flip-to-FIXED on the other side.

# ── ProseMirror (rich) editor mode ────────────────────────────────
# `with prosemirror editor` shared context sets composition_mode: :rich;
# ProseMirror replaces the standard `.d-editor-input` textarea with
# its own contenteditable surface. The `Image` global fix
# (`2620e7c`) unblocked init for most specs — they pass in isolation
# (Container 3/3, links 1/3, keymap 7/17 FIXED individually). But in
# the full Discourse suite the same specs trigger V8
# `ScriptTerminatedError` (the call timeout kills long ProseMirror
# init chains under suite-level memory / time pressure); they need either
# a longer per-call timeout budget or lighter ProseMirror init. Mark
# editor-body specs as expected-failing until that's done; Container
# subset that doesn't open the rich editor stays unconstrained.
# Remaining real PM failures after the contenteditable
# caret-move + hit-test no-retarget fixes. Each entry is a specific
# test that either depends on real layout (toolbar positioning,
# image scaling) or hits a remaining driver gap (paste-of-multiple-
# data-URIs, ordered-list `n.` input rule, code-block split round
# trips). The big catch-all regex was removed because the editor
# now boots and most specs pass.
