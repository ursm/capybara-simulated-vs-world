# Nested-view root pagination is a DLoadMore IntersectionObserver
# sentinel; without layout it intersects eagerly and loads page 2 into
# the initial render, so `initial_count` is 22 (page 1 + part of page 2)
# instead of 20. Same class as the cloaking/load-more specs.
- test: 'Nested view pagination load more roots initially shows first page of roots and loads more on scroll'
  reason: 'DLoadMore IntersectionObserver loads page 2 eagerly without layout (initial_count 22 vs 20).'
# Admin components config-area infinite-scroll: same class — a DLoadMore
# IntersectionObserver against a `resize_window(height: 400)` viewport. Without
# a layout/viewport-clip engine the in/out-of-viewport signal is unreliable, so
# `have_exactly_n_components(4)` (PAGE_SIZE=4, pre-scroll) flips between 4 and 8.
# FLAKY (not stable-fail), so `skip: true` rather than `pending` — a pending
# entry would be flagged FIXED on the runs that happen to pass.
- test: 'Admin Customize Themes Config Area Page when there are components installed loads more components when scrolling to the bottom'
  reason: 'IntersectionObserver pagination against a resized viewport; flaky without a layout engine.'
  skip: true
# `#main-container` is hidden by `{{#if postStream.firstPostNotLoaded}}`.
# The post stream's load-above sentinel is an IntersectionObserver
# (`prependMore`): without a layout engine it intersects eagerly and
# keeps loading posts above the entry point, eventually pulling in
# post_number 1 — so `firstPostPresent` becomes true and the content
# above is no longer hidden. A real browser leaves the sentinel above
# the viewport until you scroll up. Same class as the cloaking specs.
- test: 'Post stream when hiding scrollable content hides and shows content above the post stream based on loaded posts'
  reason: 'load-above IntersectionObserver sentinel over-loads posts (incl. post 1) without layout.'
# Manage-reports modal infinite-scroll list. `DLoadMore` is an
# IntersectionObserver sentinel: without a layout engine it "intersects"
# eagerly and pre-loads page 2, and our in-process `rack_fetch` is
# synchronous (no network latency) so the search refetch — which the
# server (correctly) returns 0 results for, since it matches report
# TITLE "Admin Logins" not the identifier "admin_logins" — lands before
# Capybara's poll and clears the list. A real browser leaves the
# pre-search list visible during ajax latency with the sentinel below
# the fold. Same out-of-scope class as the post-stream IO specs above.
- test: 'Admin Dashboard Redesign | Reports section lets admins customize the reports section via the manage-reports modal'
  reason: 'DLoadMore IntersectionObserver + zero-latency fetch; needs layout + network timing.'

