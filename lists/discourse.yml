# never populates the test-result-display row. The boot chain
# (`discourse-test-listen-boot` + `discourse-boot`) runs but
# QUnit''s module discovery / start() deferral has many places
# where mini_racer/quickjs differ from a real browser.
- test: 'Theme qunit testing lists themes and can run tests by id, name and url'
  reason: 'QUnit harness DOM stays empty; module discovery / start() deferral chain differs from real browser. Needs a minimal QUnit-only reproduction.'

# Re-typing the same filter into an admin search field with
# existing text causes `this.filter` to double (`default
# localedefault locale`) because send_keys appends and the
# `<input value={{this.filter}}>` binding doesn't reset between
# keystrokes. After the doubled filter the row is filtered out,
# `find_setting` finds nothing, and the `expect.to have_content`
# poll loops on a row that''s no longer in the DOM. The same
# upstream test pattern (send_keys without an explicit clear)
# should hit the same issue in real-browser; the fact that
# upstream CI passes suggests either a Capybara/Playwright
# behavior difference for send_keys we''re not yet replicating
# or a Discourse client-side reset we haven''t found.
- test: 'Admin Site Setting Locales for locale enum allows selection of a different locale'
  reason: 'Filter input doubles when type_in_search runs twice. Send_keys appends per spec; upstream test seems to rely on a clear we haven''t identified.'

# Composer image-optimization for PNGs converts via mozjpeg WASM
# in a Web Worker. Our libvips PNG decoder produces RGBA bytes
# subtly different from Chrome''s createImageBitmap output, and
# the difference propagates through the whole mozjpeg pipeline.
# Expected 285_809 bytes (Chrome) vs our 271_246 bytes (~5%).
# Needs libvips decoder-flag tuning to match Chrome''s PNG
# decode path, or a different decode backend entirely.
- test: 'Composer image optimization for uploads using media-optimization-worker png images optimizes an uploaded png image in the composer'
  reason: 'libvips PNG decode differs subtly from Chrome createImageBitmap RGBA; mozjpeg pipeline propagates the difference. 271_246 vs Chrome''s 285_809 (~5%).'

# Multi-session MessageBus delivery: real-browser long-poll keeps
# the main session''s connection open across the
# `using_session(:admin)` block, so the server pushes the
# `/client_settings` update through that open connection the
# moment the admin toggle commits. Our short-poll model has the
# main session''s V8 suspended while admin runs, so the publish
# lands AFTER admin completes — and the followup poll''s baseline
# is already ahead of the actual bus last_id (per-process
# MessageBus state differs from test-thread probe view), so the
# "ahead of bus" recovery resets the subscription to -1 and the
# in-between messages are never delivered.
- test: "Member upcoming changes when user is logged in adds and removes the body class based on MessageBus subscription for client site settings"
  reason: "Multi-session MessageBus: would need a true long-poll concurrency model so the main session's V8 can stay subscribed during `using_session(:admin)`."
