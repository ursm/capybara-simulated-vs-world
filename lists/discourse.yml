# Tests we don't expect capybara-simulated to satisfy. Each entry is
# `{test:, reason:[, engine:]}`. `test:` is preferred as the RSpec
# `full_description` (stable across upstream line-number moves) but
# may also be a `./spec/...rb:LINE` location string or a Regexp
# matched against either. `engine:` is optional; when set, the entry
# is honoured only when `CSIM_JS_ENGINE` matches (`v8` or `quickjs`),
# so engine-divergent tests don't flip-to-FIXED on the other side.

# ── ProseMirror (rich) editor mode ────────────────────────────────
# `with prosemirror editor` shared context sets composition_mode: :rich;
# ProseMirror replaces the standard `.d-editor-input` textarea with
# its own contenteditable surface. The `Image` global fix
# (`2620e7c`) unblocked init for most specs — they pass in isolation
# (Container 3/3, links 1/3, keymap 7/17 FIXED individually). But in
# the full Discourse suite the same specs trigger V8
# `ScriptTerminatedError` (mini_racer kills long ProseMirror init
# chains under suite-level memory / time pressure); they need either
# a longer per-call timeout budget or lighter ProseMirror init. Mark
# editor-body specs as expected-failing until that's done; Container
# subset that doesn't open the rich editor stays unconstrained.
# Remaining real PM failures after the contenteditable
# caret-move + hit-test no-retarget fixes. Each entry is a specific
# test that either depends on real layout (toolbar positioning,
# image scaling) or hits a remaining driver gap (paste-of-multiple-
# data-URIs, ordered-list `n.` input rule, code-block split round
# trips). The big catch-all regex was removed because the editor
# now boots and most specs pass.
- test: 'Composer - ProseMirror - Onebox Toolbar with show preview on link toolbar re-oneboxes a full onebox when clicking show preview'
  reason: 'Link-toolbar show-preview button positioning needs layout.'
- test: 'Composer - ProseMirror - Onebox Toolbar with show preview on link toolbar re-oneboxes an inline onebox when clicking show preview'
  reason: 'Same as above.'
- test: 'Composer - ProseMirror - Onebox Toolbar with inline onebox removes inline preview and converts to plain link'
  reason: 'Inline-onebox toolbar interactions depend on cursor-position layout.'
- test: 'Composer - ProseMirror - Onebox Toolbar with inline onebox shows toolbar when selecting an inline onebox'
  reason: 'Toolbar visibility derived from getBoundingClientRect of the selection.'
- test: 'Composer - ProseMirror - Toolbar heading toolbar updates toolbar active state and icon based on current heading level'
  reason: 'Toolbar floating panel selection-rect positioning needs layout.'
- test: 'Composer - ProseMirror - Toolbar toolbar state updates updates the toolbar state following the cursor position'
  reason: 'Same — cursor-rect derived UI.'
- test: 'Composer - ProseMirror - Images image lightbox navigates between images using prev/next buttons'
  reason: 'Photoswipe lightbox navigation needs real layout (see Photoswipe entries below).'
- test: 'Composer - ProseMirror - Images image toolbar sets width and height attributes when scaling external images'
  reason: 'Image scale-handles read getBoundingClientRect on the IMG.'

# ── Layout-engine dependence ──────────────────────────────────────
# We don't run a layout engine: no `getBoundingClientRect` truths,
# no viewport-clip visibility, no scroll positions, no element
# dimensions. Tests that gate on any of these can't pass here and
# never will without bringing in a full layout/render pipeline.
# Each entry below is documented with the layout property it depends
# on; if Discourse refactors the test to a non-layout signal, the
# entry should drop.

# Photoswipe lightbox: full image preview overlay positioned with
# computed dimensions, click-to-close via backdrop coordinates. The
# "single image quotes / no info button" subset works (asserts
# attribute presence, not visual position) — narrow to the visual /
# layout-driven specs.
- test: !ruby/regexp '/\ALightbox \| Photoswipe (when on mobile|when missing data attributes|when RTL language|with multiple images|with single image (can toggle image info|has the correct lightbox elements))/'
  reason: |
    Photoswipe overlay positioning + tap-to-close needs real layout
    (getBoundingClientRect, getComputedStyle on the dimmed
    container, click coordinates within image bounds).

