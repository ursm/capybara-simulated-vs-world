# Uppy form-template-field upload tests rely on a race between the
# Discourse `_filesPicked` dialog (synchronous) and the upload
# completing (slow HTTP round-trip in real browsers). The dialog
# assertion runs first; `have_no_css(".form-template-field__uploaded-files")`
# then polls during the ~hundreds of milliseconds before upload
# completes, succeeding the moment it sees 0 matches. Our env's
# in-process Rack upload completes synchronously, so the
# `uploaded-files` row is already in the DOM by the time
# `have_no_css` first polls, and the assertion fails. Verified
# against real Chrome + Playwright (`CSIM_BYPASS_DRIVER=1`): adding
# a `sleep 2` between `attach_file` and the assertions makes the test
# fail in real Chrome too — confirming the race-dependence rather
# than a driver gap. The upstream `form-template-field/upload.gjs`
# does not wire its `isUploadedFileAllowed` override into the new
# `UppyUpload` config introduced by #28710, so `onBeforeFileAdded`
# always returns `true` and the file is uploaded regardless of the
# field's `file_types` — same path in real CI as in ours, just with
# the timing difference covering for the missing check.
- test: "Composer Form Templates doesn't allow uploading an invalid file type"
  reason: "Upstream test relies on a race: dialog assertion races the upload completion. Our in-process upload finishes synchronously, so `have_no_css(.form-template-field__uploaded-files)` fails immediately. Verified the same failure in real Chrome with a 2 s post-attach sleep."
- test: "Composer Form Templates creates a post with multiple uploads"
  reason: "Same Uppy / form-template-field upload chain as the invalid-file-type test; uploadedFiles[] race + a separate audio-file detection gap that needs a deeper look."

# Multi-session MessageBus delivery: real-browser long-poll keeps the
# main session's connection open across the `using_session(:admin)`
# block, so the server pushes the `/client_settings` update through
# that open connection the moment the admin toggle commits. Our env
# polls short-form one vm.call at a time: each poll fires, server
# returns whatever messages are newer than the JS-side baseline, then
# closes. While `using_session(:admin)` runs, the main session's V8
# isn't executing — its setTimeout-driven poll loop is suspended,
# so it cannot have a connection open at the moment the admin's
# request publishes. The followup short-poll *after* the block ends
# carries a JS-side baseline ahead of the server's actual last_id
# for /client_settings (verified: middleware reports cs=130 during
# the initial main subscribe, before any admin work has happened —
# Discourse's per-process MessageBus state inside the request context
# differs from the test-thread probe's view), so the `ahead of bus`
# branch in `message_bus`'s `client.backlog` resets the subscription
# to -1 and skips delivering the messages between 56-130 that
# carried the actual `enable_upload_debug_mode=false` payload. JS
# never receives the data and the body class never flips.
#
# Fixing this needs either a long-poll connection model (would need
# a threading-runtime adjustment so main's V8 can run concurrently
# with admin's session), or a server-side change to deliver the
# in-between backlog on the "ahead of bus" recovery path.
- test: "Member upcoming changes when user is logged in adds and removes the body class based on MessageBus subscription for client site settings"
  reason: "Multi-session MessageBus delivery: real-browser long-poll keeps the main session's connection open during the admin's setting toggle and pushes the update through. Our short-poll model misses the messages and the `ahead of bus` recovery path doesn't redeliver them."

# MessageBus `/client_settings` push-on-publish chain races test
# polling. The Rack hijack hook (enabled for /message-bus/* polls
# so admin_users_list_spec:37 sees its bulk-user-delete progress
# messages) makes the long-poll deliver every server-side
# `MessageBus.publish` synchronously inside the next settle drain.
# Discourse's `onClientSettings` handler in
# `subscribe-user-notifications.js` writes to the tracked
# `siteSettings.{name}` slot, which re-renders any component
# bound to that setting. The settings admin page binds every row
# to its setting value, so the post-save publish re-renders the
# row Capybara just found — StaleElement during `have_content`'s
# poll, repeatedly, until timeout. Real browsers hit the same
# chain but the Capybara/Playwright stale-handling retry settles
# before our `have_content` does; matching that behaviour needs
# either a Node#visible_text retry-on-stale wrap in the driver
# or a debounce on the publish-delivery cadence.
- test: 'Admin Site Setting Locales for locale enum allows selection of a different locale'
  reason: 'MessageBus push-on-publish race: post-save `/client_settings` publish re-renders the setting row during `have_content` polling, repeatedly raising StaleElement.'
- test: 'Admin Dashboard Redesign | Reports section lets admins customize the reports section via the manage-reports modal'
  reason: 'Same MessageBus push-on-publish race during the modal-search → filter cycle.'

# ── Remaining four full-suite failures ─────────────────────────
# Driver-side deep dives, not layout or test-author issues. Each
# entry documents the specific root cause uncovered during the
# triage round so the next attempt has a starting point.

# Glimmer's `{{on "click" (fn this.onClick (hash …))}}` modifier
# inside the `{{#each resultType.results}}` loop in
# `app/components/search-menu/results/types.gjs` never calls
# addEventListener on the rendered `<a class="search-link">` in
# our env. Adding `{{on "mouseenter" ...}}` alongside also fails
# to register; replacing the inner `<resultType.component>`
# dynamic invocation with static text restored the modifier
# (suggests the dynamic-component invocation tears the surrounding
# modifier setup). The same `{{on}}` pattern works on
# `<li class="search-menu-assistant-item">` in `assistant-item.gjs`
# (no inner dynamic component). Needs a Glimmer-vm-level repro to
# isolate which precompile branch our env's `@ember/template-
# compiler` runtime mishandles.
- test: 'Search when search menu on desktop tracks search result clicks'
  reason: 'Glimmer `{{on "click"}}` modifier never attaches on `<a class="search-link">` inside `{{#each resultType.results}}` when the same `<a>` contains `<resultType.component>` dynamic invocation; click bubbles to body unhandled, log-search-click never fires.'

# `route_to_topic_post` triggers `topic.fromParams.afterModel` →
# `appEvents.trigger("nested:scroll-to-target")` →
# `forceScheduleScroll` → `next()` (`setTimeout 0`). The next
# transition's `setupController` + new `_renderKey` schedules a
# Glimmer re-render via `setTimeout 1`. Real browsers separate
# the two macrotasks by ≥ 1 ms of wall clock, and Capybara's
# real-time poll catches the highlight class on the OLD postEl
# in between. Our `__drainTimers(50)` fires both within one tick
# (no inter-macrotask yield); the re-render detaches the OLD
# postEl before Capybara polls, the highlight class is on a
# disconnected node, and `have_highlighted_post` never matches.
# Single-step drain made earlier polls take ~50× longer than
# Capybara's wait budget — rejected. Fixing this needs either
# a Discourse-side `schedule("afterRender", scrollToTarget)`
# or a driver-side per-microtask-batch yield.
- test: 'Nested context view in-route navigation between context views keeps the URL on /n/ and re-highlights when /t/ is routed to the post we''re already on'
  reason: 'Highlight class added to OLD postEl, Glimmer re-render (setTimeout 1) detaches it within the same `__drainTimers` tick before Capybara polls.'

