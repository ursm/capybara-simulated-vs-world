  reason: 'Link-toolbar show-preview button positioning needs layout.'
- test: 'Composer - ProseMirror - Onebox Toolbar with show preview on link toolbar re-oneboxes an inline onebox when clicking show preview'
  reason: 'Same as above.'
- test: 'Composer - ProseMirror - Onebox Toolbar with inline onebox removes inline preview and converts to plain link'
  reason: 'Inline-onebox toolbar interactions depend on cursor-position layout.'
- test: 'Composer - ProseMirror - Onebox Toolbar with inline onebox shows toolbar when selecting an inline onebox'
  reason: 'Toolbar visibility derived from getBoundingClientRect of the selection.'
- test: 'Composer - ProseMirror - Toolbar heading toolbar updates toolbar active state and icon based on current heading level'
  reason: 'Toolbar floating panel selection-rect positioning needs layout.'
- test: 'Composer - ProseMirror - Toolbar toolbar state updates updates the toolbar state following the cursor position'
  reason: 'Same — cursor-rect derived UI.'
- test: 'Composer - ProseMirror - Images image lightbox navigates between images using prev/next buttons'
