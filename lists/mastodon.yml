# Tests we don't expect capybara-simulated to satisfy. Each entry is
# `{test:, reason:[, engine:]}`. `test:` is preferred as the RSpec
# `full_description` (stable across upstream line-number moves) but
# may also be a `./spec/...rb:LINE` location string or a Regexp
# matched against either. `engine:` is optional; when set, the entry
# is honoured only when `CSIM_JS_ENGINE` matches (`v8` or `quickjs`),
# so engine-divergent tests don't flip-to-FIXED on the other side.
#
# Last verified against Mastodon on 2026-05-19.

# ── React mount aborts under live-import gap ──────────────────────
#
# All four expect `visit '/'` (unsigned-in) to mount the React SPA
# and reach the React-Router `<Redirect from='/'>` chain. The mount
# trips on React-DOM's `useState`'s `typeof a === 'function' && (a
# = a())` lazy-init: an initial_state import (`auto_play_gif` etc.)
# whose meta key is absent at test time is `undefined`, but
# `__csim_liveImport`'s function-target Proxy reports `typeof ===
# 'function'`. Calling the Proxy then triggers `Reflect.apply(undefined,
# …)` → "Function.prototype.apply was called on null", aborting the
# whole mount before any redirect runs.
#
# Same shape under both engines (QuickJS uses native ESM but the
# same React-DOM call-site crashes when the export is undefined).
# A naive fix that returns `undefined` directly for finalized-but-
# nullish exports breaks Mastodon's compose form chain in unrelated
# ways (the broader live-binding contract assumes a Proxy survives
# transient-undefined windows). Needs a deeper distinction between
# "permanent undefined" and "transient undefined".
- test: "Home page when not signed in when the landing page is set to about visits the root path and is redirected to the about page"
  reason: "React mount aborts on undefined initial_state export via Proxy lazy-init; see lists/mastodon.yml header"
- test: "Home page when not signed in when the landing page is set to trends visits the root path and is redirected to the trends page"
  reason: "same root cause as the `about` landing-page test"
- test: "Home page when not signed in when the landing page is set to local_feed visits the root path and is redirected to the local live feed page"
  reason: "same root cause as the `about` landing-page test"
- test: "UnloggedBrowsing loads the home page"
  reason: "same root cause — React mount aborts before `.columns-area__panels__main` renders"
