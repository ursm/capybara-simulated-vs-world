# Tests we don't expect capybara-simulated to satisfy. Each entry is
# `{test:, reason:}`; `test:` is preferred as the RSpec
# `full_description` (stable across upstream line-number moves) but
# may also be a `./spec/...rb:LINE` location string or a Regexp
# matched against either.
#
# Last verified against Forem on 2026-06-09
# (capybara-simulated local main / Ruby 4.0), `bin/run-forem`'s default
# `--tag js spec/system` selector.
#
# Classification convention (so failures don't need re-triage each run):
#   OUT-OF-SCOPE — needs a real layout engine / async runtime / IDNA; a
#                  failure here is NOT a driver bug (CLAUDE.md rule 1). Listed.
#   DRIVER-GAP / FLAKY — NOT listed; those get fixed, not papered over.

# ── OUT-OF-SCOPE (layout / off-screen visibility) ─────────────────
- test: "Using the editor Viewing the editor renders the logo or Community name as expected"
  reason: |
    OUT-OF-SCOPE (layout). The editor page renders the site logo twice — the
    page header's `.crayons-header .site-logo .truncate-at-2` and the editor
    form's `.crayons-article-form__logo .truncate-at-2` (articles/_v2_form.html.erb)
    — so `within(".truncate-at-2")` is ambiguous. The header copy is moved
    off-screen by the form's inline style (`.crayons-header * { position:absolute;
    left:-9999em }`, Forem PR #11701); verified in real Chrome the header span sits
    at x=-319968 with visibility:visible. Distinguishing the on-screen logo from the
    off-screen one needs viewport geometry (an explicit non-goal). The duplicate is
    NOT a parser leak — a `<base>`/`data-site-logo` attribute carrying HTML stays a
    string in our parser (verified). Will auto-flag FIXED if a layout model lands.
